[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gum-jsx"
version = "1.8.0"
description = "Python wrapper for gum.jsx, a language for creating vector graphics"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "Douglas Hanley"}
]
dependencies = [
    "Pillow"
]

[project.urls]
Homepage = "https://github.com/CompendiumLabs/gum.py"

[tool.setuptools]
packages = ["gum"]

[tool.setuptools.package-data]
gum = [
    "js/**",
]
